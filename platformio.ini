; TFT Panel — one firmware, one environment per supported screen:
;   crowpanel7          Elecrow CrowPanel ESP32 Display 7.0" (DIS08070H, board V3.0), ESP32-S3
;   waveshare-p4-7b     Waveshare ESP32-P4-WIFI6-Touch-LCD-7B, ESP32-P4 + ESP32-C6
;
; Toolchain is pinned on purpose (see docs/ARCHITECTURE.md):
;   pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5 (esp_lcd RGB with bounce buffers).

[platformio]
default_envs = crowpanel7

[env]
; Shared by every board.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    lvgl/lvgl@9.6.0
    bblanchon/ArduinoJson@7.4.2
; Noto Sans subsets (tools/fonts/build_fonts.sh), rendered at run time by LVGL tiny_ttf
board_build.embed_files =
    assets/fonts/NotoSans-400.ttf
    assets/fonts/NotoSans-600.ttf
extra_scripts = pre:tools/version.py

; Elecrow CrowPanel 7" V3.0 — ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM, UART0 via CH340C.
[env:crowpanel7]
board = esp32-s3-devkitc-1

; N4R8 module: quad flash, octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Final layout (an OTA can never change it): two 1.94 MB app slots + coredump, no filesystem.
board_build.partitions = partitions.csv

; Framework rebuilt with these options (pioarduino hybrid compile; first build is long).
; 64-byte data cache lines: twice the PSRAM burst per miss, for the RGB framebuffer traffic.
; TLS buffers in PSRAM: internal RAM is the scarce resource (Wi-Fi needs it); the common
; CA subset is enough for GitHub (OTA) and keeps the image small.
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
; Code and read-only data run from PSRAM, and the RGB LCD interrupt is IRAM-safe: a flash write
; (NVS, Wi-Fi calibration, OTA) no longer stalls the bounce-buffer refill. Without these the
; image shifted by 20-line steps and stayed shifted (Espressif's recommendation for RGB LCDs).
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y

upload_speed = 460800
build_flags =
    -DBOARD_CROWPANEL7
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=2

; VIEWE ESP32-P4 7" 1024x600, sold as UEP4S070H1024V600C-WB-C (its own firmware calls the board
; ESP32_P4_S070_WBA): JD9165 panel, GT911 touch, ESP32-C6 for Wi-Fi, 16 MB flash. Same chip and
; the same display path as the Waveshare 7B, so they share src/board/board_p4_mipi.cpp; only
; src/board/pins_p4_s070_wba.h differs, and every value in it comes from the vendor's own BSP.
; Serial is a CH340 on GPIO 37/38, not the P4's native USB.
; 🪤 16 MB of flash: the image header must say so, or the bootloader refuses to probe the chip.
; 🪤 Its CH340 drops bytes on a long transfer: 230400, not 460800.
[env:p4-s070-wba]
board = esp32-p4_r3
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_p4.csv
upload_speed = 230400
extra_scripts =
    pre:tools/version.py
    pre:tools/hosted_fw.py
board_build.embed_files =
    assets/fonts/NotoSans-400.ttf
    assets/fonts/NotoSans-600.ttf
    assets/hosted/esp32c6.bin
build_flags =
    -DBOARD_P4_S070_WBA
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=2

; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B — ESP32-P4 rev 3, 32 MB flash, 32 MB PSRAM, MIPI-DSI 1024x600,
; Wi-Fi through the on-board ESP32-C6 (esp_hosted over SDIO). USB-C = the P4's USB-Serial/JTAG.
[env:waveshare-p4-7b]
board = esp32-p4_r3
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_p4.csv
upload_speed = 921600
; The ESP32-C6's firmware matching this Arduino core's esp_hosted, installed on the C6 at boot when
; it runs an older one (tools/hosted_fw.py fetches and verifies it; src/net/coprocessor.cpp).
extra_scripts =
    pre:tools/version.py
    pre:tools/hosted_fw.py
board_build.embed_files =
    assets/fonts/NotoSans-400.ttf
    assets/fonts/NotoSans-600.ttf
    assets/hosted/esp32c6.bin
build_flags =
    -DBOARD_WAVESHARE_P4_7B
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=2

; TFT Panel — firmware for the Elecrow CrowPanel ESP32 Display 7.0" (DIS08070H, board V3.0)
; ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM, UART0 via CH340C.
;
; Toolchain is pinned on purpose (see docs/ARCHITECTURE.md):
;   pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5 (esp_lcd RGB with bounce buffers).

[platformio]
default_envs = crowpanel7

[env:crowpanel7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; N4R8 module: quad flash, octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; two OTA app slots of 1.9 MB + small SPIFFS
board_build.partitions = min_spiffs.csv

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    lvgl/lvgl@9.6.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=3

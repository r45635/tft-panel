<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/icon-32.png">
<link rel="apple-touch-icon" href="brand/icon-180.png">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #15161a; --fg: #f6f4ee; --dim: #a9aaa6; --accent: #6db56d; --card: #202127; --line: #2f3037; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 56px; }
  nav { color: var(--dim); margin-bottom: 18px; }
  a { color: var(--accent); }
  h1 { font-size: 2em; margin: 0.4em 0; }
  h2 { margin-top: 2em; padding-top: 0.6em; border-top: 1px solid var(--line); }
  img { max-width: 100%; height: auto; border-radius: 10px; }
  p img, li img { display: block; margin: 12px 0; }
  code { background: var(--card); padding: 1px 6px; border-radius: 5px; font-size: 0.92em; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  em { color: var(--dim); }
  footer.site { max-width: 820px; margin: 0 auto 32px; padding: 0 16px; color: #a9aaa6; font-size: 0.85em; text-align: center; }
  footer.site a { color: inherit; }
</style>
</head>

</body>
</html>
